# Manually-triggered release. Builds the tools/ package
# (compliance-authoring-skills), creates + pushes the version tag, and publishes
# a GitHub Release with the built wheel + sdist attached. NOT published to PyPI —
# consumers install git-direct (see README "Install"), optionally pinning the tag
# this workflow creates.
#
# Flow:
#   1. Bump `version` in tools/pyproject.toml and merge to the branch you release from.
#   2. Actions → "release" → Run workflow, on that branch, with tag = v<version>.
#   3. This verifies the tag matches tools/pyproject.toml, builds tools/ (the wheel
#      bundles skills/ + demos/), then creates+pushes the tag and the Release.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release — must match tools/pyproject.toml version (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write # required to push the tag and create the GitHub Release

jobs:
  release:
    name: Build and create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: "3.11"

      - name: Verify tag matches tools/pyproject.toml version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("tools/pyproject.toml","rb"))["project"]["version"])')"
          echo "Tag:             $TAG"
          echo "Tag version:     $TAG_VERSION"
          echo "package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG) does not match tools/pyproject.toml version ($PKG_VERSION). Bump tools/pyproject.toml or fix the tag input."
            exit 1
          fi

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin. Bump the version and use a new tag."
            exit 1
          fi

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Wheel only, built directly from the source tree — NOT via sdist. The
      # package force-includes ../skills and ../demos (repo root, outside
      # tools/); a tools/-only sdist can't carry them, and the default
      # build-wheel-from-sdist flow would fail resolving those paths. The wheel
      # bundles skills/ + demos/ and is self-contained.
      - name: Build wheel (bundles skills/ + demos/)
        working-directory: tools
        run: python -m build --wheel

      - name: Create and push tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            tools/dist/*.whl
