# APM package manifest (OpenAPM shape). Read by `apm` and the compliance-authoring-skills wrapper
# (tools/); ignored by Claude Code / OpenCode, which read only SKILL.md.
#
# This skill authors the OSCAL POA&M via the trestle *library* inside an isolated venv (see
# setup-env.md / build-poam.md), so it needs NO MCP server to work — hence no active
# `dependencies.mcp` here.
#
# OPTIONAL: the trestle MCP server (below) is left commented out. Its only POA&M-relevant tool is
# schema *validation*, which authoring barely uses; the skill validates in the isolated venv
# instead. Uncomment this block ONLY if you want the installer to also wire the trestle MCP into
# the harness (e.g. to reuse a POA&M-validate tool if/when one ships). The def mirrors the repo-root
# .mcp.json. Do NOT add a `target:` field — APM rejects unknown target tokens at parse time.
name: poam-authoring
version: "1.0.0"

# dependencies:
