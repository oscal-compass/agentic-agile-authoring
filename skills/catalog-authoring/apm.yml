# APM package manifest (OpenAPM shape). Read by `apm` and the compliance-authoring-skills
# wrapper (tools/); ignored by Claude Code / OpenCode, which read only SKILL.md. `dependencies.mcp`
# declares the MCP servers this skill needs; the trestle def mirrors the repo-root .mcp.json (the
# canonical def). Do NOT add a `target:` field — APM rejects unknown target tokens at parse time.
name: catalog-authoring
version: "1.0.0"

dependencies:
  mcp:
    - name: trestle              # self-described stdio server
      registry: false            # self-defined (not resolved from a registry)
      transport: stdio
      command: uvx
      args:
        - "--from"
        # Lower bound 1.0.0: that release made the wrapper run the trestle subprocess inside the
        # absolute `--trestle-root`, which is what these skills rely on to resolve a
        # workspace-relative path. Before it, `trestle_root` was passed as a flag and nothing more.
        # A released floor rather than the git default branch, so an install is a version someone
        # published. No `--with mcp<2` needed: 1.0.0 declares mcp>=1.10.0,<2.0.0 itself (checked on
        # PyPI and on upstream main; a resolve lands on mcp 1.30.0).
        - "compliance-trestle-mcp>=1.0.0"
        - "trestle-mcp"
