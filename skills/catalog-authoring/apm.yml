# APM package manifest (Microsoft APM / OpenAPM shape). Read by `apm` and the compliance-authoring-skills
# wrapper (tools/); ignored by Claude Code / OpenCode, which read only SKILL.md. `dependencies.mcp`
# declares the MCP servers this skill needs; the trestle def mirrors the repo-root .mcp.json (the
# canonical def). Do NOT add a `target:` field — APM rejects unknown target tokens at parse time.
name: catalog-authoring
version: "1.0.0"

dependencies:
  mcp:
    - name: trestle              # self-described stdio server
      registry: false            # self-defined (not resolved from a registry)
      transport: stdio
      command: uvx
      args:
        - "--from"
        - "git+https://github.com/oscal-compass/compliance-trestle-mcp.git"
        # Workaround: pin mcp<2 at launch. mcp 2.0.0 removed mcp.server.fastmcp, which upstream
        # trestle-mcp still imports, so an unpinned resolve crashes on import. Drop this once the
        # upstream repo caps mcp<2 (fixed in the YANA fork; PR pending oscal-compass).
        - "--with"
        - "mcp<2"
        - "trestle-mcp"
