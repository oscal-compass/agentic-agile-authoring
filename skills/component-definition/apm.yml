# APM package manifest (Microsoft APM / OpenAPM shape). Read by `apm` and the ag-au-skills
# wrapper (tools/); ignored by Claude Code / OpenCode, which read only SKILL.md. `dependencies.mcp`
# declares the MCP servers this skill needs (this skill calls trestle_task_csv_to_oscal_cd); the
# trestle def mirrors the repo-root .mcp.json (the canonical def). Do NOT add a `target:` field —
# APM rejects unknown target tokens at parse time.
name: component-definition
version: "1.0.0"

dependencies:
  mcp:
    - name: trestle              # self-described stdio server
      registry: false            # self-defined (not resolved from a registry)
      transport: stdio
      command: uvx
      args:
        - "--from"
        - "git+https://github.com/oscal-compass/compliance-trestle-mcp.git"
        - "trestle-mcp"
