[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ag-au-skills"
version = "0.1.0"
description = "thin wrapper over Microsoft APM: install portable skills into agent harnesses + wire their MCP deps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Exact-pin apm-cli (verified against 0.28.0; bumps are gated on the §5.1 integration spikes).
dependencies = ["apm-cli==0.28.0", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ag-au-skills = "ag_au_skills.cli:main"

# Flat, single-project layout: one pyproject, package listed here.
[tool.hatch.build.targets.wheel]
packages = ["ag_au_skills"]

# Bundle the repo's skills + demos into the wheel as package data so the CLI works from any
# directory without a local checkout (--source defaults to this bundle). Single source of truth
# stays the repo's top-level dirs; they are copied under ag_au_skills/_bundled/ at build time
# only (not committed — editable installs fall back to the repo checkout; see policy.py).
[tool.hatch.build.targets.wheel.force-include]
"../skills" = "ag_au_skills/_bundled/skills"
"../demos" = "ag_au_skills/_bundled/demos"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: pinned-apm integration spikes (require the `apm` CLI on PATH or APM_BIN)",
]
